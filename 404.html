<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found | CivilStrCalc</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:var(--sans);padding:24px;}
    .err-box{max-width:480px;width:100%;text-align:center;}
    .err-code{font-size:5rem;font-weight:700;color:var(--primary);font-family:var(--mono);line-height:1;margin-bottom:8px;}
    .err-title{font-size:1.25rem;font-weight:600;margin-bottom:12px;}
    .err-sub{font-size:.875rem;color:var(--text-dim);margin-bottom:32px;line-height:1.6;}
    .err-links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
    .err-btn{display:inline-block;padding:9px 20px;border-radius:6px;font-size:.85rem;font-weight:500;text-decoration:none;transition:background .15s;}
    .err-btn-primary{background:var(--primary);color:#fff;}
    .err-btn-primary:hover{background:var(--primary-dark,#1a5fa8);}
    .err-btn-sec{background:var(--white);color:var(--text);border:1px solid var(--border);}
    .err-btn-sec:hover{background:var(--bg-2,#f5f7fa);}
  </style>
  <script>
    // Redirect known old URLs
    var p = window.location.pathname;
    if (p === '/m' || p === '/m/') { window.location.replace('/'); }
    else if (p === '/pages/shear.html' || p === '/pages/shear') { window.location.replace('/pages/beam.html'); }
  </script>
</head>
<body>
  <div class="err-box">
    <div class="err-code">404</div>
    <div class="err-title">Page not found</div>
    <div class="err-sub">The page you requested doesn't exist or has been moved.<br>Try one of the calculators below.</div>
    <div class="err-links">
      <a class="err-btn err-btn-primary" href="/">Home</a>
      <a class="err-btn err-btn-sec" href="/pages/beam.html">Beam Design</a>
      <a class="err-btn err-btn-sec" href="/pages/column.html">Column Design</a>
      <a class="err-btn err-btn-sec" href="/pages/slab.html">Slab Design</a>
      <a class="err-btn err-btn-sec" href="/pages/steel-flexural.html">Steel Design</a>
    </div>
  </div>
</body>
</html>
